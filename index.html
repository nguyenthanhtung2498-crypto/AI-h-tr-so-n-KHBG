
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo KHBG THCS - Chuẩn 5512</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Gia cố shim process ngay lập tức
        window.process = { 
            env: { 
                NODE_ENV: 'production',
                API_KEY: '' // Sẽ được hệ thống tự động điền hoặc qua aistudio
            } 
        };
    </script>
    <style>
        @keyframes subtleZoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .app-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('./input_file_0.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.15;
            z-index: -10;
            pointer-events: none;
            filter: grayscale(20%) brightness(1.05);
            animation: subtleZoom 40s ease-in-out infinite;
        }
        
        #root {
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }
        
        @media print {
            .no-print { display: none !important; }
            .app-bg-overlay { display: none !important; }
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "docx": "https://esm.sh/docx@9.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div class="app-bg-overlay no-print"></div>
    <div id="root"></div>
    <!-- Đảm bảo index.tsx được nạp như một module -->
    <script type="module" src="./index.tsx"></script>
</body>
</html>
